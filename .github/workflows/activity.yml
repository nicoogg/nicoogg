name: live activity

# Every hour: rebuilds assets/activity.svg and the repositories table in README.md from public GitHub data.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths: ["scripts/**"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build activity card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build.py live
      - name: Commit if changed
        run: |
          git diff --quiet -- assets/activity.svg README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg README.md
          git commit -m "Refresh live activity"
          git push
